<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module 5 Math Quest Review</title>
    <!-- KaTeX CSS & JS for formatting LaTeX fractions correctly -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <style>
        :root {
            --bg-color: #1a1a2e;
            --panel-bg: #16213e;
            --accent-color: #0f3460;
            --highlight: #e94560;
            --gold: #f39c12;
            --text-color: #ffffff;
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            width: 90%;
            max-width: 850px;
            margin: 20px auto;
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            border: 2px solid var(--accent-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: var(--accent-color);
            padding: 8px 15px;
            border-radius: 8px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background-color: var(--accent-color);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--gold);
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.25rem;
            margin-bottom: 20px;
            line-height: 1.6;
            background: rgba(0,0,0,0.25);
            padding: 20px;
            border-radius: 8px;
            min-height: 80px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-box input, .input-box select {
            padding: 12px 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            background: #0f172a;
            color: #fff;
            outline: none;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: 2px solid transparent;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--highlight);
            border-color: white;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-correct {
            background-color: var(--correct-color) !important;
        }

        .btn-wrong {
            background-color: var(--wrong-color) !important;
        }

        .feedback-box {
            min-height: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        .screen {
            text-align: center;
        }

        .screen h1 {
            color: var(--gold);
            font-size: 2.3rem;
        }

        .matching-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .matching-table th, .matching-table td {
            border: 1px solid var(--accent-color);
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- START SCREEN -->
    <div id="start-screen" class="screen">
        <h1>⚔️ Module 5 Expressions Master Quest ⚔️</h1>
        <p>Complete 20 comprehensive challenges covering Exponents, Order of Operations, Algebraic Expressions, GCF, and Word Problems!</p>
        <div style="font-size: 4rem; margin: 15px 0;">🧙‍♂️</div>
        <button class="btn" style="font-size: 1.3rem; padding: 15px 30px;" onclick="startGame()">Begin Quest</button>
    </div>

    <!-- PLAY SCREEN -->
    <div id="play-screen" class="hidden">
        <div class="header">
            <div class="stat-box">Question <span id="level-num">1</span> / 20</div>
            <div class="stat-box">⭐ Score: <span id="score-num">0</span></div>
        </div>

        <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="question" class="question-box"></div>

        <!-- Multiple Choice Options -->
        <div id="options" class="options-grid hidden"></div>

        <!-- Text Answer Box -->
        <div id="text-input-container" class="input-box hidden">
            <input type="text" id="user-text-input" placeholder="Type your answer here..." autocomplete="off">
            <button class="btn" id="submit-text-btn" onclick="submitTextAnswer()">Submit Answer</button>
        </div>

        <!-- Matching Table Box -->
        <div id="matching-container" class="input-box hidden">
            <table class="matching-table">
                <thead>
                    <tr>
                        <th>Part</th>
                        <th>Select Category</th>
                    </tr>
                </thead>
                <tbody id="matching-tbody"></tbody>
            </table>
            <button class="btn" id="submit-match-btn" onclick="submitMatchingAnswer()">Submit Matching</button>
        </div>

        <div id="feedback" class="feedback-box"></div>

        <div class="nav-controls">
            <button id="prev-btn" class="btn" onclick="prevQuestion()">⬅️ Previous</button>
            <button id="next-btn" class="btn" onclick="nextQuestion()">Next ➔</button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen hidden">
        <h1>🎉 Quest Complete! 🎉</h1>
        <div style="font-size: 4rem;" id="final-avatar">🏆</div>
        <p>Final Score: <span id="final-score" style="color: var(--gold); font-weight: bold;">0</span> / 2000</p>
        <p id="final-message"></p>
        <button class="btn" style="font-size: 1.2rem; padding: 12px 25px;" onclick="startGame()">Try Again</button>
    </div>
</div>

<script>
    const questions = [
        // --- EXPONENT QUESTIONS (MULTIPLE CHOICE) ---
        {
            type: "mc",
            q: "Write $5 \\times 5 \\times 5 \\times 5$ using an exponent.",
            options: ["$5 \\times 4$", "$5^4$", "$4^5$", "$20$"],
            answer: 1,
            clue: "Think about which number is being repeatedly multiplied (the base) and how many times it appears (the exponent)."
        },
        {
            type: "mc",
            q: "Write $\\left(\\frac{3}{7}\\right) \\cdot \\left(\\frac{3}{7}\\right) \\cdot \\left(\\frac{3}{7}\\right)$ using an exponent.",
            options: ["$\\left(\\frac{3}{7}\\right)^3$", "$\\frac{9}{21}$", "$3^{\\frac{3}{7}}$", "$\\left(\\frac{3}{7}\\right) \\times 3$"],
            answer: 0,
            clue: "Keep the fraction inside parentheses as your base and raise it to the power equal to the number of factors."
        },
        {
            type: "mc",
            q: "Write $(2.4) \\times (2.4) \\times (2.4) \\times (2.4) \\times (2.4)$ using an exponent.",
            options: ["$(2.4) \\times 5$", "$5^{2.4}$", "$(2.4)^5$", "$12.0$"],
            answer: 2,
            clue: "Count how many times 2.4 is multiplied by itself to find the correct power."
        },

        // --- WRITING EXPRESSIONS QUESTIONS (TEXT INPUT) ---
        {
            type: "text",
            q: "Write an algebraic expression for: \"twelve fewer than the librarian's number of books, $b$\".",
            accepted: ["b-12", "b - 12"],
            clue: "Phrases like 'fewer than' switch the order! Start with the books $b$ and subtract 12."
        },
        {
            type: "text",
            q: "Write an algebraic expression for: \"the sum of $m$ and 8\".",
            accepted: ["m+8", "m + 8", "8+m", "8 + m"],
            clue: "'Sum' means addition. Combine the variable $m$ and the number 8 using a plus sign."
        },
        {
            type: "text",
            q: "Write an algebraic expression for: \"the product of 4 and $y$\".",
            accepted: ["4y", "4*y", "y*4", "4(y)", "(4)(y)", "4.y"],
            clue: "'Product' means multiplication. You can write the number right next to the variable (like 4y) or use *."
        },
        {
            type: "text",
            q: "Write an algebraic expression for: \"the quotient of 45 and $k$\".",
            accepted: ["45/k", "45 / k"],
            clue: "'Quotient' means division. The first number listed goes on top or first (45 / k)."
        },
        {
            type: "text",
            q: "Write an algebraic expression for: \"six less than five times Sam's age, $a$\".",
            accepted: ["5a-6", "5a - 6", "5*a-6", "5*a - 6"],
            clue: "First write 'five times Sam's age' ($5a$), then subtract 6 from that product."
        },

        // --- EVALUATING EXPRESSIONS QUESTIONS (TEXT INPUT) ---
        {
            type: "text",
            q: "Evaluate $12x$ when $x = \\frac{2}{3}$.",
            accepted: ["8"],
            clue: "Multiply 12 by 2, then divide by 3 (or divide 12 by 3 first, then multiply by 2)."
        },
        {
            type: "text",
            q: "Evaluate $w^2$ when $w = 1.5$.",
            accepted: ["2.25"],
            clue: "Square 1.5 by multiplying $1.5 \\times 1.5$."
        },
        {
            type: "text",
            q: "Evaluate $p - q$ when $p = 24$ and $q = 9$.",
            accepted: ["15"],
            clue: "Replace $p$ with 24 and $q$ with 9, then subtract."
        },
        {
            type: "text",
            q: "Evaluate $6n + 7$ when $n = 8$.",
            accepted: ["55"],
            clue: "Multiply $6 \\times 8$ first according to order of operations, then add 7."
        },

        // --- MATCHING TERMS QUESTIONS (4 ROWS EACH) ---
        {
            type: "matching",
            q: "Classify each part of the expression: $5s + 7s^2 + 9s + 8$",
            items: [
                { term: "5s, 7s², 9s, 8", correct: "Terms" },
                { term: "5s and 9s", correct: "Like Terms" },
                { term: "5, 7, 9", correct: "Coefficients" },
                { term: "8", correct: "Constants" }
            ],
            optionsList: ["Terms", "Like Terms", "Coefficients", "Constants"],
            clue: "Remember: Terms are all separated parts; Like Terms share variables/powers; Coefficients multiply variables; Constants stand alone."
        },
        {
            type: "matching",
            q: "Classify each part of the expression: $4e + 7e + 5 + 2e$",
            items: [
                { term: "4e, 7e, 5, 2e", correct: "Terms" },
                { term: "4e, 7e, 2e", correct: "Like Terms" },
                { term: "4, 7, 2", correct: "Coefficients" },
                { term: "5", correct: "Constants" }
            ],
            optionsList: ["Terms", "Like Terms", "Coefficients", "Constants"],
            clue: "Check that Coefficients are just the numbers in front of variables and Constants are standalone numbers."
        },
        {
            type: "matching",
            q: "Classify each part of the expression: $3x + 2y + 5x - y + 14$",
            items: [
                { term: "3x, 2y, 5x, -y, 14", correct: "Terms" },
                { term: "3x and 5x", correct: "Like Terms" },
                { term: "3, 2, 5, -1", correct: "Coefficients" },
                { term: "14", correct: "Constants" }
            ],
            optionsList: ["Terms", "Like Terms", "Coefficients", "Constants"],
            clue: "Notice that $3x$ and $5x$ match in variables. 14 has no variable attached."
        },

        // --- PEMDAS QUESTIONS (TEXT INPUT) ---
        {
            type: "text",
            q: "Evaluate using Order of Operations: $14 - 5 + 6$",
            accepted: ["15"],
            clue: "Addition and Subtraction have equal priority—work strictly from left to right!"
        },
        {
            type: "text",
            q: "Evaluate using Order of Operations: $48 \\div (12 - 4) \\times 3 - 5$",
            accepted: ["13"],
            clue: "Solve inside parentheses first ($12 - 4 = 8$), then do division and multiplication from left to right."
        },
        {
            type: "text",
            q: "Evaluate using Order of Operations: $(4 + 1)^2 + 18 \\cdot \\frac{1}{2} - 3 + 2$",
            accepted: ["33"],
            clue: "Calculate $(5)^2 = 25$ first. Then half of 18 is 9. Add and subtract left to right: $25 + 9 - 3 + 2$."
        },

        // --- WORD PROBLEMS (MULTIPLE CHOICE EXPRESSIONS) ---
        {
            type: "mc",
            q: "Raven sells face wash for $25, face lotion for $20, and makeup trials for $5. At a party, she sold 7 face washes, 4 lotions, and 4 makeup trials. Select the expression that represents the total cost.",
            options: ["$7(25) + 4(20) + 4(5)$", "$25 + 20 + 5 + 7 + 4$", "$7(25) \\cdot 4(20) \\cdot 4(5)$", "$15(25 + 20 + 5)$"],
            answer: 0,
            clue: "Multiply each item's price by how many were sold, then add those products together."
        },
        {
            type: "mc",
            q: "A student council sold 62 muffins for $0.75 each, 74 brownies for $1.25 each, and 35 cupcakes for $1.75 each. Select the expression that represents the total amount raised.",
            options: ["$(62 + 74 + 35)(0.75 + 1.25 + 1.75)$", "$62(0.75) + 74(1.25) + 35(1.75)$", "$62(0.75) \\cdot 74(1.25) \\cdot 35(1.75)$", "$0.75 + 1.25 + 1.75 + 171$"],
            answer: 1,
            clue: "Multiply quantity $\\times$ price for each treat and sum the totals."
        }
    ];

    let currentIdx = 0;
    let scores = Array(questions.length).fill(0);
    let isCorrectArray = Array(questions.length).fill(false);

    function startGame() {
        currentIdx = 0;
        scores = Array(questions.length).fill(100);
        isCorrectArray = Array(questions.length).fill(false);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        showQuestion();
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('level-num').innerText = currentIdx + 1;
        
        let totalScore = scores.reduce((a, b) => a + b, 0);
        document.getElementById('score-num').innerText = totalScore;
        document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
        
        const qBox = document.getElementById('question');
        qBox.innerHTML = q.q;

        document.getElementById('feedback').innerText = '';
        
        // Hide all input containers
        document.getElementById('options').classList.add('hidden');
        document.getElementById('text-input-container').classList.add('hidden');
        document.getElementById('matching-container').classList.add('hidden');

        const solved = isCorrectArray[currentIdx];

        if (q.type === 'mc') {
            const optsContainer = document.getElementById('options');
            optsContainer.classList.remove('hidden');
            optsContainer.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerHTML = opt;
                if (solved) {
                    btn.disabled = true;
                    if (idx === q.answer) btn.classList.add('btn-correct');
                } else {
                    btn.onclick = () => selectMCOption(idx);
                }
                optsContainer.appendChild(btn);
            });
        } else if (q.type === 'text') {
            const container = document.getElementById('text-input-container');
            container.classList.remove('hidden');
            const input = document.getElementById('user-text-input');
            const subBtn = document.getElementById('submit-text-btn');
            if (!solved) {
                input.value = '';
                input.disabled = false;
                subBtn.disabled = false;
            } else {
                input.disabled = true;
                subBtn.disabled = true;
            }
        } else if (q.type === 'matching') {
            const container = document.getElementById('matching-container');
            container.classList.remove('hidden');
            const tbody = document.getElementById('matching-tbody');
            const subBtn = document.getElementById('submit-match-btn');
            tbody.innerHTML = '';

            q.items.forEach((item, idx) => {
                const tr = document.createElement('tr');
                let optionsHTML = q.optionsList.map(o => `<option value="${o}">${o}</option>`).join('');
                tr.innerHTML = `
                    <td>${item.term}</td>
                    <td>
                        <select id="select-match-${idx}" ${solved ? 'disabled' : ''}>
                            <option value="">-- Select --</option>
                            ${optionsHTML}
                        </select>
                    </td>
                `;
                tbody.appendChild(tr);

                if (solved) {
                    document.getElementById(`select-match-${idx}`).value = item.correct;
                }
            });
            subBtn.disabled = solved;
        }

        if (solved) {
            document.getElementById('feedback').innerHTML = `<span style="color: var(--correct-color);">✨ Correct! Excellent work. ✨</span>`;
        }

        // Navigation state
        document.getElementById('prev-btn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
        
        // Lock Next button if not solved yet
        const nextBtn = document.getElementById('next-btn');
        if (!solved) {
            nextBtn.disabled = true;
            nextBtn.title = "Answer correctly to proceed!";
        } else {
            nextBtn.disabled = false;
            nextBtn.title = "";
        }
        
        // Re-render LaTeX math formulas
        if (window.renderMathInElement) {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }

    function selectMCOption(idx) {
        const q = questions[currentIdx];
        if (idx === q.answer) {
            isCorrectArray[currentIdx] = true;
            showQuestion();
        } else {
            scores[currentIdx] = Math.max(20, scores[currentIdx] - 20);
            document.getElementById('feedback').innerHTML = `<span style="color: var(--wrong-color);">💥 Not quite! Try again.</span><br><span style="color: var(--gold);">💡 Clue:</span> ${q.clue}`;
            // Highlight wrong choice temporarily
            const buttons = document.getElementById('options').children;
            buttons[idx].classList.add('btn-wrong');
            setTimeout(() => buttons[idx].classList.remove('btn-wrong'), 1000);
        }
    }

    function submitTextAnswer() {
        const input = document.getElementById('user-text-input').value.trim();
        if (!input) return;

        const q = questions[currentIdx];
        const isCorrect = q.accepted.some(acc => acc.toLowerCase().replace(/\s+/g, '') === input.toLowerCase().replace(/\s+/g, ''));
        
        if (isCorrect) {
            isCorrectArray[currentIdx] = true;
            showQuestion();
        } else {
            scores[currentIdx] = Math.max(20, scores[currentIdx] - 20);
            document.getElementById('feedback').innerHTML = `<span style="color: var(--wrong-color);">💥 Not quite! Check your work and try again.</span><br><span style="color: var(--gold);">💡 Clue:</span> ${q.clue}`;
        }
    }

    function submitMatchingAnswer() {
        const q = questions[currentIdx];
        let allCorrect = true;

        for (let i = 0; i < q.items.length; i++) {
            const val = document.getElementById(`select-match-${i}`).value;
            if (val !== q.items[i].correct) {
                allCorrect = false;
            }
        }

        if (allCorrect) {
            isCorrectArray[currentIdx] = true;
            showQuestion();
        } else {
            scores[currentIdx] = Math.max(20, scores[currentIdx] - 20);
            document.getElementById('feedback').innerHTML = `<span style="color: var(--wrong-color);">💥 Some matches are incorrect. Try again!</span><br><span style="color: var(--gold);">💡 Clue:</span> ${q.clue}`;
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            showQuestion();
        }
    }

    function nextQuestion() {
        if (isCorrectArray[currentIdx] && currentIdx < questions.length - 1) {
            currentIdx++;
            showQuestion();
        } else if (currentIdx === questions.length - 1 && isCorrectArray[currentIdx]) {
            endGame();
        }
    }

    function endGame() {
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        
        let totalScore = scores.reduce((a, b) => a + b, 0);
        document.getElementById('final-score').innerText = totalScore;

        const msg = document.getElementById('final-message');
        const avatar = document.getElementById('final-avatar');

        if (totalScore === 2000) {
            avatar.innerText = '👑';
            msg.innerText = "Flawless Victory! You mastered every problem on the first attempt!";
        } else if (totalScore >= 1500) {
            avatar.innerText = '🏆';
            msg.innerText = "Awesome job! You persevered through all hints to complete the quest!";
        } else {
            avatar.innerText = '🛡️';
            msg.innerText = "Great effort working through every single problem to completion!";
        }
    }
</script>

</body>
</html>
